services:
  app:
    build: .
    env_file: .env
    environment:
      # Persistent volume paths take precedence over .env dev values
      DATABASE_URL: "file:/data/records.db"
      COVERS_DIR: "/data/covers"
    volumes:
      - records-data:/data
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  records-data:
