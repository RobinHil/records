server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # En-têtes de sécurité appliqués à toutes les réponses.
    # (Pas de script-src : Next.js injecte des scripts inline pour l'hydratation,
    # une CSP stricte demanderait une nonce par requête.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A manual sync request can legitimately take several minutes
        # (Discogs API throttling), keep the proxy patient.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
