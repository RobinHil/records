server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Les en-têtes de sécurité sont posés par l'application (next.config.ts) et
    # non plus ici : ce fichier ne sert qu'au docker-compose de développement,
    # alors qu'en production c'est Caddy qui est devant. Les dupliquer donnerait
    # deux en-têtes Content-Security-Policy, et surtout laisserait croire à une
    # protection qui n'existerait pas une fois déployé.

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A manual sync request can legitimately take several minutes
        # (Discogs API throttling), keep the proxy patient.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
